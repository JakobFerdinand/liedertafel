name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'src/website/**'
      - 'src/website-api/**'
      - '.github/workflows/build-and-deploy-website.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'src/website/**'
      - 'src/website-api/**'
      - '.github/workflows/build-and-deploy-website.yml'

permissions:
   contents: read
   pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./src/website/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ./src/website

      - name: Astro check
        run: pnpm run check
        working-directory: ./src/website

      - name: Build
        run: pnpm run build
        working-directory: ./src/website

      - name: Publish API
        run: dotnet publish src/website-api/website-api.csproj -c Release -o website-api_output

      - name: Deploy
        if: github.actor != 'dependabot[bot]'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_RIVER_0DDEF7803 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./src/website/dist" # App source code path
          api_location: "./website-api_output" # Published API path
          # The "unexpected input" warning for the two inputs below is cosmetic;
          # the SWA deploy container reads them (see alpakasoelde deployment).
          skip_api_build: true
          config_file_location: "/src/website/"
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_RIVER_0DDEF7803 }}
          action: "close"
