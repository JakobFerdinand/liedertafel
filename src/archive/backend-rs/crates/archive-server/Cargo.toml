[package]
name = "archive-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Archive Rust origin: static Next.js export, auth/passkeys, readiness and stable JSON misses for unported API routes (#218)."

[dependencies]
archive-db = { path = "../archive-db" }
archive-telemetry = { path = "../archive-telemetry" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { workspace = true }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "util"] }
tracing = { workspace = true }
opentelemetry = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "uuid", "json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2.6"
pbkdf2 = "0.12"
webauthn-rs-core = "=0.5.5"
serde_cbor_2 = "0.13"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
azure_identity = { version = "1.0", features = ["tokio"] }
azure_core = { version = "1.1", features = ["hmac_rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
hmac = "0.12"
azure_storage_blob = "=1.1.0"
azure_storage_sas = "=1.0.0"
azure_storage_common = "=1.0.0"
async-trait = "0.1"
futures = "0.3"
time = "0.3"
azure_storage_queue = { version = "=1.1.0", default-features = false }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["image_025", "pdfium_8125", "thread_safe"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
regex = "1.12"
tracing-opentelemetry = "0.34"
opentelemetry_sdk = "0.33.1"
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
# Local gRPC/HTTP2 OTLP receiver for native operator process tests only.
axum = { version = "0.8.9", features = ["http2"] }
tracing-subscriber = { workspace = true }
ring = "0.17"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tokio = { version = "1.54", features = ["test-util"] }

[lints]
workspace = true

[[bin]]
name = "archive-server"
path = "src/main.rs"
