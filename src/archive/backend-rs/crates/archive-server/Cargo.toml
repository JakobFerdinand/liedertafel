[package]
name = "archive-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Archive Rust origin: static Next.js export, auth/passkeys, readiness and stable JSON misses for unported API routes (#218)."

[dependencies]
archive-db = { path = "../archive-db" }
archive-telemetry = { path = "../archive-telemetry" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { workspace = true }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "util"] }
tracing = { workspace = true }
opentelemetry = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "uuid", "json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2.6"
pbkdf2 = "0.12"
webauthn-rs-core = "=0.6.2"
serde_cbor_2 = "0.13"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
azure_identity = { version = "1.0", features = ["tokio"] }
azure_core = "1.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
ring = "0.17"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[lints]
workspace = true

[[bin]]
name = "archive-server"
path = "src/main.rs"
