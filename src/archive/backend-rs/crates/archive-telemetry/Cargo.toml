[package]
name = "archive-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Service-defaults equivalent of the archive: OTLP traces, metrics and logs for every backend-rs host (spec #218, wave 1)."

[dependencies]
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
hex = "0.4.3"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = "0.14.4"
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
