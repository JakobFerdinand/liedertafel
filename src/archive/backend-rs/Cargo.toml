[workspace]
resolver = "3"
members = [
	"crates/archive-telemetry",
	"crates/archive-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Test code may unwrap (clippy.toml), production paths never do: a panic on the
# request path is a 5xx or a dead worker. Wave-1 grows this list from findings.
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# Versions chosen fresh at implementation time (See backend-rs/AGENTS.md:
# "Documentation lookup is mandatory"); Cargo.lock pins exact revisions.
tokio = { version = "1.54", features = [
	"rt-multi-thread",
	"macros",
	"net",
	"signal",
	"time",
	"fs",
	"sync",
	"process",
	"io-util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
	"env-filter",
	"fmt",
	"registry",
] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
	"grpc-tonic",
	"trace",
	"metrics",
	"logs",
	"internal-logs",
] }
opentelemetry-appender-tracing = "0.33.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
