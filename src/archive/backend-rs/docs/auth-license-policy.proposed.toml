# REVIEW PROPOSAL ONLY: not active policy, not approval. Use only with --config.
# See auth-dependency-audit.md. In particular, every MPL exception needs explicit
# maintainer approval before it can be copied into the real deny.toml.
[graph]
all-features = false
targets = [
	{ triple = "aarch64-unknown-linux-gnu" },
	{ triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
private = { ignore = true }
allow = [
	"Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "MIT",
	"Unicode-3.0", "Unlicense",
	# quoted_printable 0.5.2 (lettre).
	"0BSD",
	# aws-lc-rs 1.19.0 / aws-lc-sys 0.47.0, ring 0.17.14,
	# rustls-webpki 0.103.16, untrusted 0.9.0 (Rustls/TLS).
	"ISC",
	# foldhash 0.2.0 (existing SQLx graph).
	"Zlib",
]
exceptions = [
	# Exact versions and names: never a global MPL/copyleft allow.
	{ crate = "base64urlsafedata@0.5.5", allow = ["MPL-2.0"] },
	{ crate = "webauthn-attestation-ca@0.5.5", allow = ["MPL-2.0"] },
	{ crate = "webauthn-rs-core@0.5.5", allow = ["MPL-2.0"] },
	{ crate = "webauthn-rs-proto@0.5.5", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
deny = [
	{ name = "azure_storage_blobs", reason = "dead legacy plural crate; use azure_storage_blob" },
	{ name = "azure_storage_queues", reason = "dead legacy plural crate; use azure_storage_queue" },
]
