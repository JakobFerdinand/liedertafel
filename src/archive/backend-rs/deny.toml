# Workspace bans/config for cargo-deny (see backend-rs/AGENTS.md):
# advisories, licenses and the Azure-crate naming trap are all enforced here.
# Run: cargo deny check

[graph]
all-features = false
# The container image and this host both build on Linux GNU triples.
targets = [
	{ triple = "aarch64-unknown-linux-gnu" },
	{ triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The workspace crates carry no license field (the repo itself has no LICENSE
# file yet); publish = false marks them private, so the license check is
# scoped to third-party crates, which must match this allowlist.
private = { ignore = true }
# Wave 1 pulls the tokio/axum/tower/opentelemetry ecosystem; extend this list
# (with a comment naming the crate) when a new wave adds dependencies.
allow = [
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"MIT",
	"Unicode-3.0",
	"Unlicense",
]

[bans]
multiple-versions = "warn"
deny = [
	# The plural 0.21.0 crates are dead legacy track-1 crates; the official
	# Azure storage crates are azure_storage_blob / azure_storage_queue
	# (singular). An agent working from training data reaches for the plural
	# names — make that mistake fail the build (spec #218, nested AGENTS.md).
	{ name = "azure_storage_blobs", reason = "dead legacy plural crate; use azure_storage_blob" },
	{ name = "azure_storage_queues", reason = "dead legacy plural crate; use azure_storage_queue" },
]
